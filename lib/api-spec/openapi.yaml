openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Estate Agent CRM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: CRM contact operations
  - name: conversations
    description: Conversation and messaging operations
  - name: messages
    description: Message operations
  - name: dashboard
    description: Dashboard metrics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: leadIntent
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a new contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
    put:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation by ID (phone number)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Not found

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /dashboard/metrics:
    get:
      operationId: getDashboardMetrics
      tags: [dashboard]
      summary: Get dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Contact:
      type: object
      properties:
        id:
          type: string
          description: DynamoDB customer_id (UUID)
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
        leadIntent:
          type: string
          nullable: true
          description: "buyer, renter, landlord, vendor, investment, home buyer"
        summary:
          type: string
          nullable: true
          description: Summary of what the prospect is looking for
        propertyInMind:
          type: string
          nullable: true
          description: URL or description of property in mind
        bedrooms:
          type: integer
          nullable: true
        budget:
          type: string
          nullable: true
        enquiryPostcode:
          type: string
          nullable: true
        enquiryPropType:
          type: string
          nullable: true
          description: "terraced, flat, detached"
        status:
          type: string
          nullable: true
          description: "active or inactive"
        scrapedListings:
          type: string
          nullable: true
          description: JSON string of similar scraped listings
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - tags
        - createdAt
        - updatedAt

    CreateContactRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
        leadIntent:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        propertyInMind:
          type: string
          nullable: true
        bedrooms:
          type: integer
          nullable: true
        budget:
          type: string
          nullable: true
      required:
        - name
        - phone

    UpdateContactRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
        leadIntent:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        propertyInMind:
          type: string
          nullable: true
        bedrooms:
          type: integer
          nullable: true
        budget:
          type: string
          nullable: true

    Conversation:
      type: object
      properties:
        id:
          type: string
          description: Phone number used as conversation ID
        contactId:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        channel:
          type: string
          description: "whatsapp, sms, email"
        status:
          type: string
          description: "active, closed, pending"
        lastMessage:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
        messageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - contactId
        - contactName
        - contactPhone
        - channel
        - status
        - unreadCount
        - createdAt

    ConversationDetail:
      type: object
      properties:
        id:
          type: string
        contactId:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        channel:
          type: string
        status:
          type: string
        lastMessage:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
        - id
        - contactId
        - contactName
        - contactPhone
        - channel
        - status
        - unreadCount
        - createdAt
        - messages

    CreateConversationRequest:
      type: object
      properties:
        contactId:
          type: string
        channel:
          type: string
      required:
        - contactId
        - channel

    Message:
      type: object
      properties:
        id:
          type: string
          description: message_id from DynamoDB
        conversationId:
          type: string
        direction:
          type: string
          description: "inbound, outbound"
        role:
          type: string
          description: "user, assistant"
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        senderName:
          type: string
          nullable: true
      required:
        - id
        - conversationId
        - direction
        - content
        - sentAt

    SendMessageRequest:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    DashboardMetrics:
      type: object
      properties:
        leadsEngaged:
          type: integer
        leadsEngagedInstantly:
          type: integer
        viewingsBooked:
          type: integer
        reactivatedLeads:
          type: integer
        referralLeads:
          type: integer
        portalLeadsQualified:
          type: integer
        hotLeads:
          type: integer
        buyers:
          type: integer
        renters:
          type: integer
        landlordsVendors:
          type: integer
        costSavingsGBP:
          type: number
        timeSavingsHours:
          type: number
        newConversationsLastWeek:
          type: array
          items:
            $ref: "#/components/schemas/DailyCount"
        messagesByChannel:
          type: array
          items:
            $ref: "#/components/schemas/ChannelCount"
        funnel:
          $ref: "#/components/schemas/FunnelData"
      required:
        - leadsEngaged
        - leadsEngagedInstantly
        - viewingsBooked
        - reactivatedLeads
        - referralLeads
        - portalLeadsQualified
        - hotLeads
        - buyers
        - renters
        - landlordsVendors
        - costSavingsGBP
        - timeSavingsHours
        - newConversationsLastWeek
        - messagesByChannel
        - funnel

    DailyCount:
      type: object
      properties:
        date:
          type: string
        count:
          type: integer
      required:
        - date
        - count

    ChannelCount:
      type: object
      properties:
        channel:
          type: string
        count:
          type: integer
      required:
        - channel
        - count

    FunnelData:
      type: object
      properties:
        newLeads:
          type: integer
        engaged:
          type: integer
        qualified:
          type: integer
        viewingsBooked:
          type: integer
        offers:
          type: integer
      required:
        - newLeads
        - engaged
        - qualified
        - viewingsBooked
        - offers
